# Project Intake — one-command local stack.
#
#   docker compose up --build
#
# Variable substitution (${...}) is read from the root .env automatically, so
# JWT_SECRET / OPENAI_API_KEY are picked up from the same file the app already uses.
# The SQLite database lives on the `intake-db` named volume and survives
# `docker compose down` (use `down -v` to wipe it).

services:
  backend:
    build:
      context: ./backend
    environment:
      # Absolute path on the mounted volume — independent of cwd/schema location.
      DATABASE_URL: "file:/data/app.db"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in your root .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      PORT: "3000"
      HOST: "0.0.0.0"
    volumes:
      - intake-db:/data
    expose:
      - "3000"
    healthcheck:
      # Node 20 has a global fetch; avoids needing curl/wget in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin; the bundle calls /api/* and nginx proxies to backend.
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  intake-db:
