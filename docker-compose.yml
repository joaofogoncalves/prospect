# Prospect — one-command local stack.
#
#   docker compose up --build
#
# Secrets and config come straight from the root `.env` via `env_file` below — no
# variable names or values are duplicated here. The one exception is DATABASE_URL,
# which `.env` points at the local dev DB (`file:./dev.db`); the container overrides
# it to the volume path so data persists. (`environment` wins over `env_file`.)
# The SQLite database lives on the `prospect-db` named volume and survives
# `docker compose down` (use `down -v` to wipe it).

name: prospect

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Override the .env value: absolute path on the mounted volume, not the host
      # dev DB. This is the only var the container needs to set itself.
      DATABASE_URL: "file:/data/app.db"
    volumes:
      - prospect-db:/data
    expose:
      - "3000"
    healthcheck:
      # Node 20 has a global fetch; avoids needing curl/wget in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin; the bundle calls /api/* and nginx proxies to backend.
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prospect-db:
