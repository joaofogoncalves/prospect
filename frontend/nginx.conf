server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # API calls are proxied to the backend container over the compose network.
    # The /api/ prefix is preserved (no trailing slash on proxy_pass), matching the
    # backend's routes (/api/auth/*, /api/intakes/*). `backend` resolves via Docker DNS.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
